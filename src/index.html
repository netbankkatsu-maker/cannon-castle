<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="城をタッチして大砲を撃つ、3D城破壊ゲーム"><title>大砲でお城をくずせ！</title><meta name="theme-color" content="#2d644d"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="icon" href="/icons/icon-192.png"><link rel="stylesheet" href="./style.css"></head><body>
<div id="cannon-castle-3d">

<div class="top"><div><h2>お城くずし</h2></div><div class="money">🪙 <span data-coins>0</span></div></div>
<div class="viewport"><div class="loading" role="status">3Dの城を準備中…</div><div class="hud"><span class="chip" data-stage>城 1</span><span class="chip" data-destroyed>破壊率 0%</span></div><div class="hint">タッチで砲撃</div></div>
<div class="actions"><button type="button" class="fire cursor-interaction" hidden disabled>💥 発射！</button><button type="button" class="next cursor-interaction" disabled>次の城へ →</button></div>
<div class="utility"><button type="button" class="next cursor-interaction" data-rebuild disabled>↶ 再生</button><button type="button" class="next cursor-interaction" data-install hidden>ホーム画面に追加</button></div><div class="upgrades"><button type="button" class="buy cursor-interaction" data-buy="power" title="爆風の範囲と破壊力を強化" disabled><b>💣 威力 Lv.<i data-level="power">1</i></b><span data-price="power">30 コイン</span></button><button type="button" class="buy cursor-interaction" data-buy="speed" title="装填時間を短縮" disabled><b>⚡ 連射 Lv.<i data-level="speed">1</i></b><span data-price="speed">40 コイン</span></button><button type="button" class="buy cursor-interaction" data-buy="auto" title="自動砲撃を解放・強化" disabled><b>⚙️ 自動 Lv.<i data-level="auto">0</i></b><span data-price="auto">75 コイン</span></button></div>
<label class="auto"><input type="checkbox" data-auto disabled> 自動砲撃</label><div class="status" aria-live="polite"></div>

</div>

<p class="pwa-note" data-pwa-status hidden></p><script type="module" src="./pwa.js"></script><script type="module" src="./game.js"></script></body></html>
