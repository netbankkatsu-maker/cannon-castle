<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="城をタッチして大砲を撃つ、3D城破壊ゲーム"><title>灰の旅路 — 沈黙の城</title><meta name="theme-color" content="#151e2d"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="icon" href="/icons/icon-192.png"><link rel="stylesheet" href="./style.css?v=10"><link rel="stylesheet" href="./art.css?v=10"></head><body>
<div id="cannon-castle-3d">

<header class="top"><h2>灰の旅路</h2><div class="money" aria-label="所持コイン"><span aria-hidden="true" class="coin-icon">●</span><small data-currency-label>魂片</small><span data-coins>0</span></div></header>
<section class="home-screen" data-home hidden>
 <div class="home-portraits" aria-hidden="true"><img src="/assets/ash-wanderer.webp" class="wanderer-portrait" alt=""><img src="/assets/memory-soul.webp" class="soul-portrait" alt=""></div><h1>魂の祭壇</h1><p class="home-voice">灰の人よ、次の旅に記憶を繋ごう。</p>
 <p class="home-result" data-home-result></p><p class="home-record" data-home-record></p>
 <button type="button" class="network-entry" data-altar>✦ 魂の祭壇で恒久強化</button>
 <div class="ash-vessel" role="img" aria-label="灰の器"><div class="ash-fill" data-ash-fill></div><span>✧</span></div>
 <section class="cargo" aria-label="持ち込みの準備"><h2>灰の器 <span data-cargo-weight></span></h2>
 <label><span>石弾 <small>灰の重み1・標準弾</small></span><input type="number" min="0" step="1" inputmode="numeric" data-cargo="stone" aria-label="石弾の持ち込み数"></label>
 <label><span>鉄弾 <small>灰の重み3・強い衝撃</small></span><input type="number" min="0" step="1" inputmode="numeric" data-cargo="iron" aria-label="鉄弾の持ち込み数"></label>
 <label><span>炸裂弾 <small>灰の重み4・広い爆風</small></span><input type="number" min="0" step="1" inputmode="numeric" data-cargo="burst" aria-label="炸裂弾の持ち込み数"></label>
 <label><span>修理キット <small>灰の重み5・HP35回復</small></span><input type="number" min="0" step="1" inputmode="numeric" data-cargo="repair" aria-label="修理キットの持ち込み数"></label>
 <p data-cargo-error aria-live="polite"></p></section>
 <button type="button" class="journey-start" data-start>過去へ旅立つ →</button>
</section>
<div class="viewport"><div class="loading" role="status">3Dの城を準備中…</div><div class="hud"><span class="chip" data-stage>城 1</span><span class="chip" data-destroyed>破壊率 0%</span></div><div class="combat-hud"><span data-cannon-hp></span><span data-ammo-total></span></div><div class="threat-tag" data-threat></div><div class="relic-strip" data-relics></div><div class="hint">タッチで砲撃</div><div class="reload-meter" data-reload role="progressbar" aria-label="装填" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><div class="reload-fill" data-reload-fill></div><span data-reload-text>0.0秒</span></div><div class="placement-panel" data-placement hidden><span>マスを選んで設置</span><button type="button" data-cancel-placement>キャンセル</button></div></div>
<div class="actions"><button type="button" class="fire cursor-interaction" hidden disabled>発射</button><button type="button" class="next cursor-interaction" disabled>戦利品を選ぶ →</button></div>
<section class="command-deck" aria-label="砲台の強化"><div class="ammo-types" role="group" aria-label="使用する砲弾"><button type="button" data-ammo="stone">石弾</button><button type="button" data-ammo="iron">鉄弾</button><button type="button" data-ammo="burst">炸裂弾</button></div><div class="upgrades"><button type="button" class="buy cursor-interaction" data-buy="power" title="爆風の範囲と破壊力を強化" disabled><span class="upgrade-icon" aria-hidden="true"></span><b>威力</b><small class="level">Lv.<i data-level="power">1</i></small><span data-price="power">30 コイン</span></button><button type="button" class="buy cursor-interaction" data-buy="speed" title="装填時間を短縮" disabled><span class="upgrade-icon" aria-hidden="true"></span><b>連射</b><small class="level">Lv.<i data-level="speed">1</i></small><span data-price="speed">40 コイン</span></button><button type="button" class="buy cursor-interaction" data-buy="auto" title="自動砲撃を解放・強化" disabled><span class="upgrade-icon" aria-hidden="true"></span><b>主砲自動</b><small class="level">Lv.<i data-level="auto">0</i></small><span data-price="auto">75 コイン</span></button></div>
<button type="button" class="add-turret" data-add-turret disabled><b><span aria-hidden="true">＋</span> 砲台を追加</b><span><span data-turret-price>120</span> コイン</span></button>
<button type="button" class="network-entry" data-network disabled>✦ 旅の強化網</button>
<label class="auto"><input type="checkbox" data-auto disabled> 自動砲撃</label><div class="utility"><button type="button" data-repair hidden>修理</button><button type="button" data-return>帰還</button><button type="button" class="next cursor-interaction" data-rebuild disabled>↶ 組み直す</button><button type="button" class="next cursor-interaction" data-install hidden>ホーム画面に追加</button></div></section><div class="status" aria-live="polite"></div>

</div>

<p class="pwa-note" data-pwa-status hidden></p><script type="module" src="./pwa.js?v=10"></script><script type="module" src="./game.js?v=10"></script></body></html>
