<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="城をタッチして大砲を撃つ、3D城破壊ゲーム"><title>大砲でお城をくずせ！</title><meta name="theme-color" content="#151e2d"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="icon" href="/icons/icon-192.png"><link rel="stylesheet" href="./style.css?v=7"></head><body>
<div id="cannon-castle-3d">

<header class="top"><h2>お城くずし</h2><div class="money" aria-label="所持コイン"><span aria-hidden="true" class="coin-icon">●</span><span data-coins>0</span></div></header>
<div class="viewport"><div class="loading" role="status">3Dの城を準備中…</div><div class="hud"><span class="chip" data-stage>城 1</span><span class="chip" data-destroyed>破壊率 0%</span></div><div class="hint">タッチで砲撃</div><div class="reload-meter" data-reload role="progressbar" aria-label="装填" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><div class="reload-fill" data-reload-fill></div><span data-reload-text>0.0秒</span></div><div class="placement-panel" data-placement hidden><span>マスを選んで設置</span><button type="button" data-cancel-placement>キャンセル</button></div></div>
<div class="actions"><button type="button" class="fire cursor-interaction" hidden disabled>💥 発射！</button><button type="button" class="next cursor-interaction" disabled>次の城へ →</button></div>
<section class="command-deck" aria-label="砲台の強化"><div class="upgrades"><button type="button" class="buy cursor-interaction" data-buy="power" title="爆風の範囲と破壊力を強化" disabled><span class="upgrade-icon" aria-hidden="true">💣</span><b>威力</b><small class="level">Lv.<i data-level="power">1</i></small><span data-price="power">30 コイン</span></button><button type="button" class="buy cursor-interaction" data-buy="speed" title="装填時間を短縮" disabled><span class="upgrade-icon" aria-hidden="true">⚡</span><b>連射</b><small class="level">Lv.<i data-level="speed">1</i></small><span data-price="speed">40 コイン</span></button><button type="button" class="buy cursor-interaction" data-buy="auto" title="自動砲撃を解放・強化" disabled><span class="upgrade-icon" aria-hidden="true">⚙️</span><b>主砲自動</b><small class="level">Lv.<i data-level="auto">0</i></small><span data-price="auto">75 コイン</span></button></div>
<button type="button" class="add-turret" data-add-turret disabled><b><span aria-hidden="true">＋</span> 砲台を追加</b><span><span data-turret-price>120</span> コイン</span></button>
<label class="auto"><input type="checkbox" data-auto disabled> 自動砲撃</label><div class="utility"><button type="button" class="next cursor-interaction" data-rebuild disabled>↶ 組み直す</button><button type="button" class="next cursor-interaction" data-install hidden>ホーム画面に追加</button></div></section><div class="status" aria-live="polite"></div>

</div>

<p class="pwa-note" data-pwa-status hidden></p><script type="module" src="./pwa.js?v=7"></script><script type="module" src="./game.js?v=7"></script></body></html>
